<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord KPI</title>
<style>
:root { --nuit:#0f1a23; --bleu:#007bff; --orange:#ffa500; --creme:#fcf9e6;
  --blanc:#ffffff; --gris:#737373; --bon:#1f9d55; --moyen:#d98a00;
  --alerte:#c0392b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --blanc:#141c24; --creme:#1d2733;
    --nuit:#edf2f7; --gris:#9aa7b4; }
}
:root[data-theme="dark"] { --blanc:#141c24; --creme:#1d2733;
  --nuit:#edf2f7; --gris:#9aa7b4; }
* { box-sizing:border-box; }
body { margin:0; padding:24px 16px; background:var(--creme); color:var(--nuit);
  font:16px/1.5 Inter, system-ui, sans-serif; }
main { max-width:980px; margin:0 auto; background:var(--blanc);
  border-radius:14px; padding:24px; border-top:8px solid var(--bleu); }
h1 { font-size:1.4rem; margin:0 0 .2em; }
h3 { color:var(--bleu); font-size:1rem; margin:1.2em 0 .4em; }
.sous { color:var(--gris); font-size:.9rem; margin:0 0 1em; }
footer { color:var(--gris); font-size:.8rem; margin-top:1.2em; }
.grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px; margin-top:1em; }
.carte { background:var(--creme); border-radius:12px; padding:12px 14px;
  border-left:6px solid var(--gris); }
.carte.etat-bon { border-color:var(--bon); }
.carte.etat-alerte { border-color:var(--alerte); }
.carte.etat-moyen, .carte.etat-sans-seuil { border-color:var(--moyen); }
.carte .nom { font-size:.8rem; color:var(--gris); font-weight:600; }
.carte .valeur { font-size:1.5rem; font-weight:700; margin:.2em 0; }
.carte .obj, .carte .decision { font-size:.75rem; color:var(--gris); }
section ul { margin:.3em 0 1em; }
</style>
</head>
<body>
<main>
  <h1>{{TITRE}}</h1>
  <p class="sous">{{PERIODE}} — {{PHRASE}}</p>
  <div class="grille">
  {{CARTES}}
  </div>
  {{SECTIONS}}
  <footer>{{RESUME}}. Gabarit et règles : get_report_brief (type vendredi) —
  un indicateur sans mesure est écrit « non mesuré », jamais estimé.</footer>
</main>
</body>
</html>
